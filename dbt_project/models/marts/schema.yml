version: 2

models:
  - name: fct_daily_revenue
    description: Daily completed-order revenue for the CEO dashboard.
    columns:
      - name: order_date
        data_tests:
          - not_null
          # One row per day is a business invariant of this fact table (it is
          # grouped by order_date). A duplicate day would silently double-count
          # revenue on the CEO dashboard.
          - unique
      - name: daily_revenue
        data_tests:
          - not_null
      - name: completed_order_rows
        data_tests:
          - not_null
