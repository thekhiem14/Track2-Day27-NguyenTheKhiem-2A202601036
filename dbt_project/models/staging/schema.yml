version: 2

models:
  - name: stg_orders
    description: Cleaned order records used by downstream marts.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          # Referential integrity: every order should point at a known customer.
          # Catches upstream customer-dimension load failures/partial syncs that
          # a not_null/unique check on orders alone would miss.
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD', 'VND']
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'completed', 'refunded', 'cancelled']

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
